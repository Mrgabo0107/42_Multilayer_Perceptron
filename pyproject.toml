[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "MP"
version = "0.1.0"
description = "Multilayer Perceptron from scratch - School 42"
dependencies = [
    "pandas>=2.3.3",
    "numpy>=1.26.4",
    "plotly>=5.15.0",
]
[project.scripts]
mlp_split = "MP.split_dataset:main"
mlp_training = "MP.training_model:main"
mlp_test = "MP.prediction:main"

[tool.setuptools]
packages = ["MP", "MP.math_utils", "MP.training_mp"]